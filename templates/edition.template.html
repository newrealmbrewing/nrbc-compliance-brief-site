<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23000000'/%3E%3Ctext x='50' y='68' font-size='52' font-family='Arial' font-weight='bold' fill='%2300B050' text-anchor='middle'%3ENR%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background-color:#ebebeb; }
  .sitenav { background:#000000; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
  .sitenav .brand { font-family:Oswald,'Arial Narrow',Arial,sans-serif; font-weight:700; color:#ffffff; font-size:15px; letter-spacing:1px; text-decoration:none; }
  .sitenav .brand span { color:#00B050; }
  .sitenav a.back { font-family:'Open Sans',Arial,Helvetica,sans-serif; font-size:13px; color:#00B050; text-decoration:none; }
  .sitenav a.back:hover { text-decoration:underline; }
  /* Desktop presentation (2026-08-26): center the fixed-width email column
     and scale it up on wide viewports. `zoom` scales layout+text in all
     modern browsers; unsupported browsers just get the centered column. */
  .brief-wrap > table { margin:0 auto; }
  @media (min-width: 900px)  { .brief-wrap { zoom: 1.25; } }
  @media (min-width: 1400px) { .brief-wrap { zoom: 1.5; } }
  @media (min-width: 1900px) { .brief-wrap { zoom: 1.75; } }
  /* Audio transcript card (2026-08-26): the narration script is the verbatim
     transcript of the episode; collapsed by default below the brief. */
  details.transcript { max-width:620px; margin:0 auto 40px auto; background:#ffffff; padding:18px 32px 8px 32px; box-sizing:border-box; }
  details.transcript summary { cursor:pointer; font-family:'Open Sans',Arial,Helvetica,sans-serif; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:#00B050; padding-bottom:10px; }
  details.transcript[open] summary { border-bottom:2px solid #000000; margin-bottom:6px; }
  details.transcript p { font-family:'Open Sans',Arial,Helvetica,sans-serif; font-size:14px; color:#2b2b2b; line-height:21px; }
  details.transcript p:last-child { padding-bottom:14px; }
</style>
</head>
<body>
<nav class="sitenav"><a class="brand" href="../">NEW REALM BREWING <span>&mdash;</span> COMPLIANCE BRIEF</a><a class="back" href="../">&larr; All editions</a></nav>
<div class="brief-wrap">
{{EDITION_BODY}}
{{TRANSCRIPT_SECTION}}
</div>
</body>
</html>
