<style>
  /* Self-hosted fonts (perf pass v4, 2026-09-16): served from this domain and
     preloaded, with font-display:optional — the font is either ready at first
     paint or this view keeps the metric-matched fallback, so the layout can
     never shift in any environment. */
  @font-face { font-family:'Open Sans'; font-style:normal; font-weight:400; font-display:optional; src:url(/assets/fonts/open-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family:'Open Sans'; font-style:normal; font-weight:600; font-display:optional; src:url(/assets/fonts/open-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family:'Open Sans'; font-style:normal; font-weight:700; font-display:optional; src:url(/assets/fonts/open-sans-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family:'Open Sans'; font-style:italic; font-weight:400; font-display:optional; src:url(/assets/fonts/open-sans-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family:'Oswald'; font-style:normal; font-weight:500; font-display:optional; src:url(/assets/fonts/oswald-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family:'Oswald'; font-style:normal; font-weight:700; font-display:optional; src:url(/assets/fonts/oswald-latin-700-normal.woff2) format('woff2'); }
  /* Fallback font metrics (perf pass 2026-09-16, v2): tiered metric-matched
     fallbacks measured in Chromium — whichever local font a machine has
     (Arial/Liberation, Roboto, Noto, DejaVu) renders at the web font's exact
     width, so the font swap causes no layout shift in any environment. */
  @font-face { font-family:'os-fb-arial'; src:local('Arial'),local('Liberation Sans'),local('Helvetica Neue'); size-adjust:104%; ascent-override:107%; descent-override:29%; line-gap-override:0%; }
  @font-face { font-family:'os-fb-roboto'; src:local('Roboto'); size-adjust:104.2%; ascent-override:107%; descent-override:29%; line-gap-override:0%; }
  @font-face { font-family:'os-fb-noto'; src:local('Noto Sans'); size-adjust:99%; ascent-override:107%; descent-override:29%; line-gap-override:0%; }
  @font-face { font-family:'os-fb-dejavu'; src:local('DejaVu Sans'); size-adjust:92.1%; ascent-override:107%; descent-override:29%; line-gap-override:0%; }
  @font-face { font-family:'osw-fb-rc'; src:local('Roboto Condensed'),local('Liberation Sans Narrow'); size-adjust:96.8%; ascent-override:119%; descent-override:29%; line-gap-override:0%; }
  @font-face { font-family:'osw-fb-arial'; src:local('Arial'),local('Liberation Sans'); size-adjust:85.8%; ascent-override:119%; descent-override:29%; line-gap-override:0%; }
  @font-face { font-family:'osw-fb-roboto'; src:local('Roboto'); size-adjust:85.9%; ascent-override:119%; descent-override:29%; line-gap-override:0%; }
  @font-face { font-family:'osw-fb-noto'; src:local('Noto Sans'); size-adjust:81.7%; ascent-override:119%; descent-override:29%; line-gap-override:0%; }
  @font-face { font-family:'osw-fb-dejavu'; src:local('DejaVu Sans'); size-adjust:76%; ascent-override:119%; descent-override:29%; line-gap-override:0%; }
  .brief-wrap [style*="Open Sans"] { font-family:'Open Sans','os-fb-arial','os-fb-roboto','os-fb-noto','os-fb-dejavu',Arial,Helvetica,sans-serif !important; }
  .brief-wrap [style*="Oswald"] { font-family:Oswald,'osw-fb-rc','osw-fb-arial','osw-fb-roboto','osw-fb-noto','osw-fb-dejavu','Arial Narrow',Arial,sans-serif !important; }
  /* Site-only contrast pass (2026-09-16): darken low-contrast email colors when
     the brief renders on the web; the email itself is unchanged. Text on the
     black header/footer cells is restored — those pass on dark backgrounds. */
  .brief-wrap [style*="color:#8a8a8a"] { color:#646464 !important; }
  .brief-wrap [style*="color:#00B050"] { color:#007636 !important; }
  .brief-wrap [style*="#000000"] [style*="color:#8a8a8a"] { color:#8a8a8a !important; }
  .brief-wrap [style*="#000000"] [style*="color:#00B050"] { color:#00B050 !important; }
  .brief-wrap p > a[style*="color:#00B050"] { text-decoration:underline !important; }

  body { margin:0; padding:0; background-color:#ebebeb; }
  .sitenav { background:#000000; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
  .sitenav .brand { font-family:Oswald,'osw-fb-rc','osw-fb-arial','osw-fb-roboto','osw-fb-noto','osw-fb-dejavu','Arial Narrow',Arial,sans-serif; font-weight:700; color:#ffffff; font-size:15px; letter-spacing:1px; text-decoration:none; }
  .sitenav .brand span { color:#00B050; }
  .sitenav a.back { font-family:'Open Sans','os-fb-arial','os-fb-roboto','os-fb-noto','os-fb-dejavu',Arial,Helvetica,sans-serif; font-size:13px; color:#00B050; text-decoration:none; }
  .sitenav a.back:hover { text-decoration:underline; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  /* Desktop presentation (2026-08-26): center the fixed-width email column
     and scale it up on wide viewports. `zoom` scales layout+text in all
     modern browsers; unsupported browsers just get the centered column. */
  .brief-wrap > table { margin:0 auto; }
  @media (min-width: 900px)  { .brief-wrap { zoom: 1.25; } }
  @media (min-width: 1400px) { .brief-wrap { zoom: 1.5; } }
  @media (min-width: 1900px) { .brief-wrap { zoom: 1.75; } }
  /* Mobile presentation (2026-08-27): the brief is an Outlook-safe email with
     inline styles and a fixed 620px column, so on small screens the wrapper
     page reflows it — fluid column, stacked header, trimmed side padding —
     using !important to outrank the inline email styles. */
  @media (max-width: 700px) {
    .brief-wrap > table > tbody > tr > td { padding:10px 0 !important; }
    .brief-wrap table[width="620"], .brief-wrap table[style*="620px"] { width:100% !important; }
    .brief-wrap td[style*="32px"] { padding-left:18px !important; padding-right:18px !important; }
    .brief-wrap td[style*="vertical-align:middle"] { display:block; width:auto !important; text-align:left !important; }
    .brief-wrap table[align="right"] { float:none !important; margin:14px 0 2px 0 !important; }
    .brief-wrap img { max-width:100%; height:auto; }
    details.transcript { padding:18px 18px 8px 18px; }
  }
  /* Audio transcript card (2026-08-26): the narration script is the verbatim
     transcript of the episode; collapsed by default below the brief. */
  details.transcript { max-width:620px; margin:0 auto 40px auto; background:#ffffff; padding:18px 32px 8px 32px; box-sizing:border-box; }
  details.transcript summary { cursor:pointer; font-family:'Open Sans','os-fb-arial','os-fb-roboto','os-fb-noto','os-fb-dejavu',Arial,Helvetica,sans-serif; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:2px; color:#00B050; padding-bottom:10px; }
  details.transcript[open] summary { border-bottom:2px solid #000000; margin-bottom:6px; }
  details.transcript p { font-family:'Open Sans','os-fb-arial','os-fb-roboto','os-fb-noto','os-fb-dejavu',Arial,Helvetica,sans-serif; font-size:14px; color:#2b2b2b; line-height:21px; }
  details.transcript p:last-child { padding-bottom:14px; }
  /* Previous/next edition navigation (2026-09-15): strengthens internal crawl
     paths through the archive and lets readers page between editions. */
  nav.edition-nav { max-width:620px; margin:0 auto 40px auto; background:#000000; padding:14px 20px; box-sizing:border-box; display:flex; align-items:center; justify-content:space-between; gap:12px; border-radius:6px; }
  nav.edition-nav a { font-family:'Open Sans','os-fb-arial','os-fb-roboto','os-fb-noto','os-fb-dejavu',Arial,Helvetica,sans-serif; font-size:13px; color:#00B050; text-decoration:none; white-space:nowrap; }
  nav.edition-nav a:hover { text-decoration:underline; }
  nav.edition-nav a.all { color:#9e9e9e; }
  nav.edition-nav span.off { min-width:90px; }
  nav.edition-nav .prev { text-align:left; }
  nav.edition-nav .next { text-align:right; }
</style>
